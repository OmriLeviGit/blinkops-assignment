[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketforge-cli"
version = "0.1.0"
description = "Command line client for TicketForge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.27",
    "httpx>=0.28",
    "rich>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "respx>=0.23",
    "pytest-cov>=7",
    "ruff>=0.17",
    "mypy>=2.4",
]

[project.scripts]
tforge = "ticketforge_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ticketforge_cli"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# conftest sets env vars before importing rich, on purpose
"tests/conftest.py" = ["E402"]

[tool.mypy]
files = ["src"]
strict = true
