[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketforge-cli"
version = "0.1.0"
description = "Command line client for TicketForge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "pytest-cov>=5",
]

[project.scripts]
tforge = "ticketforge_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ticketforge_cli"]

[tool.coverage.report]
show_missing = true
fail_under = 95
